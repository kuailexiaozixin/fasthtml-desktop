[project]
name = "open-docflow"
version = "0.1.0"
description = "Dokumentų darbo eigos valdymo sistema — open-source workflow engine for government document processing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Predictive Labs", email = "info@predictivelabs.co.uk"},
]
dependencies = [
    "python-fasthtml>=0.12.0",
    "sqlalchemy>=2.0",
    # Ported from PostgreSQL to SQLite (stdlib driver) — no psycopg2 needed.
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9",
    "uvicorn>=0.30.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
