# dsh-fasthtml-desktop bundle patch — registers the fasthtml-desktop skill provider.
#
# When this bundle is installed (dsh plugin add dsh-fasthtml-desktop) and listed
# in a profile's dsh.profile.bundles, this insert mounts the plugin that
# registers the embedded fasthtml-desktop skill on ctx.skills. The `name` below
# is the package name; Node resolves it to this package's index.js, which
# exports the Cordis plugin (name/apply/inject).

- insert:
    - id: fasthtml-desktop
      name: dsh-fasthtml-desktop
